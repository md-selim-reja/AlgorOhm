            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (nativeFetch && (!desc || desc.configurable)) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return nativeFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  nativeFetch = nextFetch;
                }
              },
            });
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            var isExtensionError =
              typeof event.filename === 'string' &&
              event.filename.indexOf('chrome-extension://') === 0;
            var isFetchSetterError =
              typeof event.message === 'string' &&
              event.message.indexOf('Cannot set property fetch of #<Window>') !== -1;
            if (isExtensionError || isFetchSetterError) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
